<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DynSTEER 评估看板</title>
  <script defer src="./data.js"></script>
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --panel-soft: #f9fbfe;
      --text: #172033;
      --muted: #627086;
      --line: #dbe3ee;
      --line-strong: #c4cfdd;
      --accent: #1463ff;
      --accent-soft: #eaf1ff;
      --ok: #108a42;
      --warn: #c77a00;
      --bad: #c93636;
      --ink: #2b3447;
      --trajectory-fr: 34;
      --graph-fr: 30;
      --stage-fr: 36;
      --trajectory-col: 34fr;
      --graph-col: 30fr;
      --stage-col: 36fr;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button {
      font: inherit;
    }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: 64px;
      background: #243043;
      border-right: 1px solid #182235;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 18px;
      color: #ffffff;
      z-index: 4;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #ffffff;
      color: #243043;
      font-weight: 800;
      font-size: 17px;
    }

    .app {
      min-height: 100vh;
      height: 100vh;
      margin-left: 64px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      flex-shrink: 0;
      background: rgba(246, 248, 251, 0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }

    .run-row,
    .scenario-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      min-height: 62px;
    }

    .run-row {
      border-bottom: 1px solid var(--line);
      position: relative;
      overflow: visible;
    }

    .scenario-row {
      position: relative;
      overflow: visible;
    }

    .workspace {
      display: grid;
      grid-template-columns:
        minmax(300px, var(--trajectory-col))
        10px
        minmax(320px, var(--graph-col))
        10px
        minmax(340px, var(--stage-col));
      gap: 0;
      padding: 12px;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .panel {
      --panel-scale: 1;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      min-height: 0;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .panel-splitter {
      position: relative;
      align-self: stretch;
      width: 10px;
      border: 0;
      background: transparent;
      cursor: col-resize;
      touch-action: none;
    }

    .panel-splitter::before {
      content: "";
      position: absolute;
      inset: 8px 4px;
      width: 2px;
      border-radius: 999px;
      background: var(--line-strong);
      transition: background 120ms ease, box-shadow 120ms ease;
    }

    .panel-splitter:hover::before,
    .panel-splitter:focus-visible::before {
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(20, 99, 255, 0.12);
    }

    .panel-title {
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      background: var(--panel-soft);
    }

    .panel-title h2 {
      margin: 0;
      font-size: calc(16px * var(--panel-scale));
      line-height: 1.3;
    }

    .panel-title p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: calc(12px * var(--panel-scale));
      line-height: 1.4;
    }

    .panel-body {
      padding: 12px;
      overflow: auto;
      min-height: 0;
      flex: 1;
      font-size: calc(12px * var(--panel-scale));
    }

    .panel-legend {
      display: grid;
      justify-items: end;
      gap: 5px;
      color: var(--muted);
      font-size: calc(11px * var(--panel-scale));
      line-height: 1.2;
    }

    .legend-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .legend-swatch {
      width: 14px;
      height: 9px;
      border: 2px solid var(--line-strong);
      border-radius: 3px;
      background: #ffffff;
    }

    .legend-swatch.pass {
      border-color: rgba(16, 138, 66, 0.72);
    }

    .legend-swatch.fail {
      border-color: rgba(201, 54, 54, 0.76);
    }

    .legend-swatch.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .legend-swatch.virtual {
      border-style: dashed;
    }

    .metric-list {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: max-content;
    }

    .metric-list {
      flex-wrap: wrap;
      min-width: 0;
    }

    .topbar-select {
      position: relative;
      z-index: 11;
    }

    .topbar-select:focus-within {
      z-index: 30;
    }

    .run-select {
      width: min(420px, 100%);
      flex: 0 1 420px;
    }

    .case-select {
      width: min(760px, 100%);
      flex: 0 1 760px;
    }

    .select-search-input {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: #ffffff;
      color: var(--ink);
      padding: 8px 36px 8px 12px;
      font: inherit;
      outline: none;
    }

    .select-search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(20, 99, 255, 0.12);
    }

    .topbar-select::after {
      content: "";
      position: absolute;
      top: 50%;
      right: 15px;
      width: 7px;
      height: 7px;
      border-right: 1.5px solid var(--muted);
      border-bottom: 1.5px solid var(--muted);
      transform: translateY(-65%) rotate(45deg);
      pointer-events: none;
    }

    .select-option-list {
      position: absolute;
      z-index: 40;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      max-height: calc(34px * 9 + 12px);
      overflow: auto;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 12px 28px rgba(23, 32, 51, 0.14);
      padding: 6px;
    }

    .select-option {
      width: 100%;
      min-height: 34px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      padding: 7px 9px;
      text-align: left;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .select-option:hover,
    .select-option.active {
      background: var(--accent-soft);
      color: #073fba;
    }

    .select-empty {
      padding: 10px;
      color: var(--muted);
    }

    .metric-chip,
    .badge {
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--muted);
      border-radius: 999px;
      min-height: 28px;
      padding: 5px 9px;
      font-size: calc(12px * var(--panel-scale));
      line-height: 1.25;
      white-space: nowrap;
    }

    .metric-chip strong {
      color: var(--text);
      margin-left: 4px;
      font-weight: 700;
    }

    .badge.ok,
    .status-pass {
      color: var(--ok);
      border-color: rgba(16, 138, 66, 0.28);
      background: rgba(16, 138, 66, 0.08);
    }

    .badge.warn,
    .status-partial {
      color: var(--warn);
      border-color: rgba(199, 122, 0, 0.3);
      background: rgba(199, 122, 0, 0.09);
    }

    .badge.bad,
    .status-fail {
      color: var(--bad);
      border-color: rgba(201, 54, 54, 0.3);
      background: rgba(201, 54, 54, 0.08);
    }

    .empty {
      display: grid;
      place-items: center;
      min-height: 220px;
      padding: 24px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
      background: #fbfcff;
    }

    .step-card,
    .stage-card {
      border: 1px solid var(--line);
      background: #ffffff;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      transition: border-color 120ms ease, box-shadow 120ms ease, background 120ms ease;
    }

    .step-card.selected,
    .stage-card.selected,
    .step-card.range-selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(20, 99, 255, 0.12);
      background: #fbfdff;
    }

    .step-head,
    .stage-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .step-meta,
    .stage-meta,
    .badge-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .step-index {
      color: var(--text);
      font-size: calc(13px * var(--panel-scale));
      font-weight: 800;
    }

    .actor {
      border-radius: 6px;
      padding: 3px 7px;
      background: #eef2f8;
      color: #344258;
      font-size: calc(12px * var(--panel-scale));
      font-weight: 700;
    }

    .event-type {
      color: var(--muted);
      font-size: calc(12px * var(--panel-scale));
    }

    .content {
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
      padding: 9px;
      background: #f7f9fc;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: #263246;
      font-size: calc(12px * var(--panel-scale));
      line-height: 1.55;
      max-height: 220px;
      overflow: auto;
    }

    details {
      margin-top: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcff;
    }

    summary,
    .detail-summary {
      cursor: pointer;
      color: var(--ink);
      font-size: calc(12px * var(--panel-scale));
      font-weight: 700;
      padding: 7px 9px;
    }

    .detail-text {
      margin: 0;
      padding: 0 9px 9px;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--muted);
      font-size: calc(12px * var(--panel-scale));
      line-height: 1.45;
    }

    .graph-panel .panel-body {
      overflow-x: hidden;
    }

    .graph-svg {
      width: 100%;
      min-width: 0;
      min-height: 0;
      height: auto;
      display: block;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcff;
    }

    .milestone-inline-detail {
      height: 100%;
      overflow: auto;
      padding: 6px 8px;
      color: var(--muted);
      font-size: calc(11px * var(--panel-scale));
      line-height: 1.4;
    }

    .milestone-inline-detail details {
      margin: 0 0 6px;
      border-radius: 6px;
      background: #ffffff;
    }

    .milestone-inline-detail .constraint-item {
      margin: 0 8px 6px;
      background: #f8fbff;
    }

    .milestone-inline-detail .constraint-item summary {
      font-weight: 600;
    }

    .milestone-inline-detail summary {
      padding: 6px 8px;
      font-size: calc(11px * var(--panel-scale));
    }

    .milestone-inline-detail pre {
      margin: 0;
      padding: 0 8px 8px;
      white-space: pre-wrap;
      word-break: break-word;
      font: inherit;
    }

    .milestone-node {
      cursor: pointer;
    }

    .milestone-node rect {
      fill: #ffffff;
      stroke: var(--line-strong);
      stroke-width: 1.5;
      transition: stroke 120ms ease, filter 120ms ease, fill 120ms ease;
    }

    .milestone-node.selected rect {
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 2;
      filter: drop-shadow(0 2px 5px rgba(20, 99, 255, 0.25));
    }

    .milestone-node.selected-stage rect {
      fill: #f1f7ff;
      stroke: var(--accent);
      stroke-width: 2;
    }

    .milestone-node.selected.selected-stage rect {
      fill: var(--accent-soft);
      filter: drop-shadow(0 2px 5px rgba(20, 99, 255, 0.25));
    }

    .milestone-node.virtual rect {
      stroke-dasharray: 5 4;
    }

    .milestone-node.pass rect {
      stroke: rgba(16, 138, 66, 0.65);
    }

    .milestone-node.fail rect {
      stroke: rgba(201, 54, 54, 0.72);
    }

    .milestone-node text {
      fill: var(--text);
      font-size: calc(12px * var(--panel-scale));
      font-weight: 700;
      pointer-events: none;
    }

    .graph-edge {
      stroke: #9aa8ba;
      stroke-width: 1.7;
      marker-end: url(#arrow);
    }

    .graph-edge.selected-stage {
      stroke: var(--accent);
      stroke-width: 2.4;
    }

    .stage-card {
      cursor: pointer;
    }

    .stage-detail-card {
      padding: 0;
      cursor: default;
    }

    .stage-summary {
      cursor: pointer;
      display: block;
      padding: 10px;
      list-style: none;
    }

    .stage-summary::-webkit-details-marker {
      display: none;
    }

    .stage-detail-body {
      padding: 0 10px 10px;
    }

    .stage-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: calc(14px * var(--panel-scale));
      font-weight: 800;
    }

    .stage-section {
      margin-top: 10px;
    }

    .score-section {
      margin-top: 8px;
      padding: 0;
      overflow: hidden;
    }

    .score-section .detail-summary {
      margin: 0;
      padding: 8px 10px;
    }

    .score-section .score-row {
      padding: 0 10px;
    }

    .score-section .score-row:last-child {
      padding-bottom: 8px;
    }

    .score-row {
      display: grid;
      grid-template-columns: minmax(96px, 1fr) minmax(80px, 42%);
      align-items: center;
      gap: 8px;
      min-height: 24px;
      color: var(--ink);
      font-size: calc(12px * var(--panel-scale));
    }

    .score-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .score-value {
      display: grid;
      grid-template-columns: 44px 1fr;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .score-bar {
      height: 7px;
      border-radius: 999px;
      background: #e8edf5;
      overflow: hidden;
    }

    .score-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
    }

    .weight-fill {
      background: var(--warn);
    }

    @media (max-width: 1100px) {
      body {
        overflow: auto;
      }

      .sidebar {
        display: none;
      }

      .app {
        margin-left: 0;
        height: auto;
        overflow: visible;
      }

      .workspace {
        grid-template-columns: 1fr;
        gap: 12px;
        overflow: visible;
      }

      .panel-splitter {
        display: none;
      }

      .panel {
        min-height: auto;
        height: auto;
      }
    }
  </style>
</head>
<body>
  <aside class="sidebar" aria-label="主导航">
    <div class="brand-mark">D</div>
  </aside>
  <main class="app">
    <header class="topbar">
      <section class="run-row" aria-label="运行记录切换"></section>
      <section class="scenario-row" aria-label="场景切换"></section>
    </header>
    <section class="workspace">
      <section class="panel trajectory-panel" aria-label="执行轨迹"></section>
      <div class="panel-splitter trajectory-graph-splitter" role="separator" aria-label="调整执行轨迹和里程碑图宽度" data-left="trajectory" data-right="graph" tabindex="0"></div>
      <section class="panel graph-panel" aria-label="里程碑图"></section>
      <div class="panel-splitter graph-stage-splitter" role="separator" aria-label="调整里程碑图和评估阶段宽度" data-left="graph" data-right="stage" tabindex="0"></div>
      <section class="panel stage-panel" aria-label="评估阶段"></section>
    </section>
  </main>
  <script>
    const SVG_NS = "http" + "://www.w3.org/2000/svg";
    const state = {
      data: null,
      runIndex: 0,
      scenarioIndex: 0,
      selectedMilestoneId: null,
      selectedStageId: null,
      openStageIds: new Set(),
      panelFractions: { trajectory: 34, graph: 30, stage: 36 },
      resizeObserver: null
    };

    window.addEventListener("DOMContentLoaded", init);

    function init() {
      state.data = window.DYNSTEER_DATA || { runs: [] };
      initPanelResize();
      renderAll();
      updatePanelScales();
    }

    function currentRun() {
      return (state.data.runs || [])[state.runIndex] || null;
    }

    function currentScenario() {
      const run = currentRun();
      return run ? (run.scenarios || [])[state.scenarioIndex] || null : null;
    }

    function renderAll() {
      renderRunRow();
      renderScenarioRow();
      renderTrajectory();
      renderGraph();
      renderStages();
      updatePanelScales();
    }

    function initPanelResize() {
      const workspace = document.querySelector(".workspace");
      if (!workspace) return;
      applyPanelFractions();
      workspace.querySelectorAll(".panel-splitter").forEach((splitter) => {
        splitter.addEventListener("pointerdown", (event) => startPanelResize(event, splitter));
        splitter.addEventListener("keydown", (event) => resizePanelWithKeyboard(event, splitter));
      });
      window.addEventListener("resize", updatePanelScales);
      if (window.ResizeObserver) {
        state.resizeObserver = new ResizeObserver(updatePanelScales);
        document.querySelectorAll(".panel").forEach((panel) => state.resizeObserver.observe(panel));
      }
    }

    function startPanelResize(event, splitter) {
      if (window.matchMedia("(max-width: 1100px)").matches) return;
      const leftKey = splitter.dataset.left;
      const rightKey = splitter.dataset.right;
      if (!leftKey || !rightKey) return;
      event.preventDefault();
      const workspace = document.querySelector(".workspace");
      const workspaceWidth = workspace ? workspace.getBoundingClientRect().width : 0;
      if (!workspaceWidth) return;
      const startX = event.clientX;
      const startLeft = state.panelFractions[leftKey];
      const startRight = state.panelFractions[rightKey];
      const totalFraction = state.panelFractions.trajectory + state.panelFractions.graph + state.panelFractions.stage;
      const fractionPerPixel = totalFraction / workspaceWidth;

      const handleMove = (moveEvent) => {
        const delta = (moveEvent.clientX - startX) * fractionPerPixel;
        applyPanelPairFractions(leftKey, rightKey, startLeft + delta, startRight - delta);
      };
      const stopMove = () => {
        document.removeEventListener("pointermove", handleMove);
        document.removeEventListener("pointerup", stopMove);
        document.removeEventListener("pointercancel", stopMove);
      };
      document.addEventListener("pointermove", handleMove);
      document.addEventListener("pointerup", stopMove);
      document.addEventListener("pointercancel", stopMove);
    }

    function resizePanelWithKeyboard(event, splitter) {
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      const leftKey = splitter.dataset.left;
      const rightKey = splitter.dataset.right;
      if (!leftKey || !rightKey) return;
      event.preventDefault();
      const delta = event.key === "ArrowLeft" ? -2 : 2;
      applyPanelPairFractions(
        leftKey,
        rightKey,
        state.panelFractions[leftKey] + delta,
        state.panelFractions[rightKey] - delta
      );
    }

    function applyPanelPairFractions(leftKey, rightKey, leftValue, rightValue) {
      const minimum = { trajectory: 18, graph: 20, stage: 20 };
      const pairTotal = state.panelFractions[leftKey] + state.panelFractions[rightKey];
      let nextLeft = Math.max(minimum[leftKey], leftValue);
      let nextRight = pairTotal - nextLeft;
      if (nextRight < minimum[rightKey]) {
        nextRight = minimum[rightKey];
        nextLeft = pairTotal - nextRight;
      }
      state.panelFractions[leftKey] = Number(nextLeft.toFixed(2));
      state.panelFractions[rightKey] = Number(nextRight.toFixed(2));
      applyPanelFractions();
      updatePanelScales();
    }

    function applyPanelFractions() {
      const workspace = document.querySelector(".workspace");
      if (!workspace) return;
      ["trajectory", "graph", "stage"].forEach((key) => {
        const value = state.panelFractions[key];
        workspace.style.setProperty(`--${key}-fr`, String(value));
        workspace.style.setProperty(`--${key}-col`, `${value}fr`);
      });
    }

    function updatePanelScales() {
      const specs = [
        [".trajectory-panel", 360],
        [".graph-panel", 400],
        [".stage-panel", 420]
      ];
      specs.forEach(([selector, baseWidth]) => {
        const panel = document.querySelector(selector);
        if (!panel) return;
        const width = panel.getBoundingClientRect().width || baseWidth;
        const scale = clamp(width / baseWidth, 0.78, 1.18);
        panel.style.setProperty("--panel-scale", scale.toFixed(3));
      });
    }

    function renderRunRow() {
      const container = document.querySelector(".run-row");
      clear(container);
      const runs = state.data.runs || [];
      if (!runs.length) {
        appendEmptyInline(container, "暂无可展示的运行记录");
        return;
      }

      const selector = renderTopbarSelector({
        items: runs,
        selectedIndex: state.runIndex,
        selectClassName: "run-select",
        inputClassName: "run-search-input",
        optionListClassName: "run-option-list",
        optionClassName: "run-option",
        emptyClassName: "run-empty",
        emptyText: "无匹配 run",
        labelForItem: runId,
        onSelect: (match) => {
          state.runIndex = match.index;
          state.scenarioIndex = 0;
          resetSelection();
          renderAll();
        }
      });

      const metrics = el("div", "metric-list");
      const run = currentRun();
      const summary = run ? run.summary || {} : {};
      metrics.append(

    function renderTopbarSelector(config) {
      const items = config.items || [];
      const selected = items[config.selectedIndex] || items[0];
      const selector = el("div", `topbar-select ${config.selectClassName || ""}`);
      const input = el("input", `select-search-input ${config.inputClassName || ""}`);
      input.type = "text";
      input.autocomplete = "off";
      input.spellcheck = false;
      input.setAttribute("role", "combobox");
      input.setAttribute("aria-expanded", "false");
      input.value = config.labelForItem(selected);

      const options = el("div", `select-option-list ${config.optionListClassName || ""}`);
      options.hidden = true;
      let activeIndex = 0;
      let suppressNextClickOpen = false;

      const openOptions = (query, preferredActiveIndex) => {
        const matches = filterSelectorItemsByPrefix(items, query, config.labelForItem);
        activeIndex = Number.isInteger(preferredActiveIndex)
          ? clamp(preferredActiveIndex, 0, Math.max(0, matches.length - 1))
          : selectedMatchIndex(matches, config.selectedIndex);
        options.hidden = false;
        input.setAttribute("aria-expanded", "true");
        renderTopbarOptions(options, matches, activeIndex, config);
      };
      const closeOptions = () => {
        options.hidden = true;
        input.setAttribute("aria-expanded", "false");
      };
      const selectMatch = (match) => {
        if (!match) return;
        closeOptions();
        config.onSelect(match);
      };

      input.addEventListener("mousedown", (event) => {
        if (!options.hidden && document.activeElement === input) {
          event.preventDefault();
          suppressNextClickOpen = true;
          closeOptions();
        }
      });
      input.addEventListener("focus", () => {
        input.select();
        openOptions("");
      });
      input.addEventListener("click", () => {
        if (suppressNextClickOpen) {
          suppressNextClickOpen = false;
          return;
        }
        if (options.hidden && document.activeElement === input) {
          openOptions(input.value);
        }
      });
      input.addEventListener("input", () => {
        openOptions(input.value, 0);
      });
      input.addEventListener("keydown", (event) => {
        const matches = filterSelectorItemsByPrefix(items, input.value, config.labelForItem);
        if (event.key === "Escape") {
          closeOptions();
          input.value = config.labelForItem(items[config.selectedIndex] || items[0]);
          return;
        }
        if (event.key === "ArrowDown") {
          event.preventDefault();
          activeIndex = Math.min(activeIndex + 1, Math.max(0, matches.length - 1));
          renderTopbarOptions(options, matches, activeIndex, config);
          return;
        }
        if (event.key === "ArrowUp") {
          event.preventDefault();
          activeIndex = Math.max(0, activeIndex - 1);
          renderTopbarOptions(options, matches, activeIndex, config);
          return;
        }
        if (event.key === "Enter") {
          event.preventDefault();
          selectMatch(matches[activeIndex] || matches[0]);
        }
      });

      selector.addEventListener("focusout", () => {
        window.setTimeout(() => {
          if (!selector.contains(document.activeElement)) closeOptions();
        }, 0);
      });

      selector.append(input, options);
      return selector;
    }

    function renderTopbarOptions(container, matches, activeIndex, config) {
      clear(container);
      if (!matches.length) {
        const empty = el("div", `select-empty ${config.emptyClassName || ""}`);
        empty.textContent = config.emptyText;
        container.append(empty);
        return;
      }

      matches.forEach((match, index) => {
        const option = el("button", `select-option ${config.optionClassName || ""}`);
        option.type = "button";
        option.textContent = match.label;
        option.title = match.label;
        option.classList.toggle("active", index === activeIndex);
        option.addEventListener("mousedown", (event) => event.preventDefault());
        option.addEventListener("click", () => config.onSelect(match));
        container.append(option);
      });
      scrollActiveOptionToCenter(container);
    }

    function filterSelectorItemsByPrefix(items, query, labelForItem) {
      const normalizedQuery = String(query || "").trim().toLowerCase();
      return (items || [])
        .map((item, index) => ({
          item,
          index,
          label: labelForItem(item)
        }))
        .filter((match) => {
          if (!normalizedQuery) return true;
          return match.label.toLowerCase().startsWith(normalizedQuery);
        });
    }

    function selectedMatchIndex(matches, selectedIndex) {
      const index = matches.findIndex((match) => match.index === selectedIndex);
      return index >= 0 ? index : 0;
    }

    function scrollActiveOptionToCenter(container) {
      const active = container.querySelector(".select-option.active");
      if (!active) return;
      window.requestAnimationFrame(() => {
        const centeredTop = active.offsetTop - (container.clientHeight - active.offsetHeight) / 2;
        container.scrollTop = Math.max(0, centeredTop);

    function bestMilestoneAttempt(milestoneId, scenario) {
      if (!milestoneId || !scenario) return null;
      const attempts = Array.isArray(scenario.match_attempts) ? scenario.match_attempts : [];
      let best = null;
      attempts.forEach((attempt) => {
        const candidates = Array.isArray(attempt.candidate_scores) ? attempt.candidate_scores : [];
        candidates.forEach((candidate) => {
          if (!candidate || candidate.milestone_id !== milestoneId) return;
          const score = candidate.score || {};
          const value = Number(score.score);
          if (!Number.isFinite(value)) return;
          if (!best || value > best.value || (value === best.value && Number(attempt.step_index) > Number(best.attempt.step_index))) {
            best = { attempt, candidate, value };
          }
        });
      });
      return best;
    }

    function milestoneAttemptDetailText(best) {
      if (!best) return "无";
      const attempt = best.attempt || {};
      const candidate = best.candidate || {};
      const score = candidate.score || {};
      const boundary = candidate.boundary || score.boundary || {};
      const parts = [
        `step_index: ${formatValue(attempt.step_index)}`,
        `step_id: ${formatValue(attempt.step_id)}`,
        `boundary_id: ${formatValue(boundary.boundary_id)}`,
        `boundary_step: ${formatValue(boundary.step_index)}`,
        `score: ${formatScore(score.score)}`,
        `status: ${formatValue(score.status)}`,

        `ready_before: ${(attempt.ready_before || []).join(", ") || "无"}`,

      ];
      const constraintScores = Array.isArray(score.constraint_scores) ? score.constraint_scores : [];
      if (constraintScores.length) {
        parts.push("constraint_scores:");
        constraintScores.forEach((item) => {
          const evidence = Array.isArray(item.evidence) && item.evidence.length
            ? ` evidence=${item.evidence.join(" | ")}`

          const actual = item.actual === undefined ? "" : ` actual=${shortJson(item.actual, 900)}`;
          parts.push(`- ${item.constraint_id || "constraint"} score=${formatScore(item.score)} missing=${formatValue(item.missing)}${evidence}${actual}`);
        });

    function graphLayout(graph) {
      const nodes = graph.nodes || [];
      const edges = (graph.edges || []).filter((edge) => edge.source && edge.target);
      const ids = nodes.map((node) => node.milestone_id).filter(Boolean);
      const indegree = new Map(ids.map((id) => [id, 0]));
      const outgoing = new Map(ids.map((id) => [id, []]));
      edges.forEach((edge) => {
        if (!indegree.has(edge.source) || !indegree.has(edge.target)) return;
        indegree.set(edge.target, indegree.get(edge.target) + 1);
        outgoing.get(edge.source).push(edge.target);
      });

      const layerById = new Map();
      const queue = ids.filter((id) => indegree.get(id) === 0);
      if (!queue.length && ids.length) queue.push(ids[0]);
      queue.forEach((id) => layerById.set(id, 0));

      while (queue.length) {
        const id = queue.shift();
        const nextLayer = (layerById.get(id) || 0) + 1;
        (outgoing.get(id) || []).forEach((target) => {
          indegree.set(target, indegree.get(target) - 1);
          layerById.set(target, Math.max(layerById.get(target) || 0, nextLayer));
          if (indegree.get(target) === 0) queue.push(target);
        });
      }

      ids.forEach((id, index) => {
        if (!layerById.has(id)) layerById.set(id, index);
      });

      const layers = new Map();
      nodes.forEach((node, index) => {
        const id = node.milestone_id || `node-${index}`;
        const layer = layerById.get(id) || 0;
        if (!layers.has(layer)) layers.set(layer, []);
        layers.get(layer).push(node);
      });

      const positioned = new Map();
      const sortedLayers = Array.from(layers.keys()).sort((a, b) => a - b);
      const sidePadding = 30;
      const minLayerGap = 24;
      const layerGap = 92;
      const layerSpecs = sortedLayers.map((layer) => {
        const layerNodes = layers.get(layer);
        const boxes = layerNodes.map((node) => selectedMilestoneBox(node.milestone_id));
        const totalBoxWidth = boxes.reduce((total, box) => total + box.width, 0);
        return {
          layerNodes,
          boxes,
          height: Math.max(...boxes.map((box) => box.height)),
          contentWidth: totalBoxWidth + minLayerGap * Math.max(0, layerNodes.length - 1)
        };
      });
      const widestLayer = Math.max(360, ...layerSpecs.map((spec) => spec.contentWidth));
      const width = widestLayer + sidePadding * 2;
      let cursorY = 34;

      layerSpecs.forEach((spec) => {
        const { layerNodes, boxes } = spec;
        const usableWidth = width - sidePadding * 2;
        const totalBoxWidth = boxes.reduce((total, box) => total + box.width, 0);
        const gap = layerNodes.length > 1
          ? Math.max(minLayerGap, (usableWidth - totalBoxWidth) / (layerNodes.length - 1))
          : 0;
        const contentWidth = totalBoxWidth + gap * Math.max(0, layerNodes.length - 1);
        let cursorX = sidePadding + (usableWidth - contentWidth) / 2;
        layerNodes.forEach((node, index) => {
          const id = node.milestone_id;
          const box = boxes[index];
          positioned.set(id, {
            node,
            x: cursorX + box.width / 2,
            y: cursorY + spec.height / 2
          });
          cursorX += box.width + gap;
        });
        cursorY += spec.height + layerGap;
      });
      return { nodes: positioned, edges, width, height: Math.max(220, cursorY - layerGap + 34) };
    }

    function drawEdges(svg, layout, stageNodeIds, scenario) {
      const defs = document.createElementNS(SVG_NS, "defs");
      const marker = document.createElementNS(SVG_NS, "marker");
      marker.setAttribute("id", "arrow");
      marker.setAttribute("viewBox", "0 0 10 10");
      marker.setAttribute("refX", "8");
      marker.setAttribute("refY", "5");
      marker.setAttribute("markerWidth", "6");
      marker.setAttribute("markerHeight", "6");
      marker.setAttribute("orient", "auto-start-reverse");
      const path = document.createElementNS(SVG_NS, "path");
      path.setAttribute("d", "M 0 0 L 10 5 L 0 10 z");
      path.setAttribute("fill", "#9aa8ba");
      marker.append(path);
      defs.append(marker);
      svg.append(defs);

      layout.edges.forEach((edge) => {
        const source = layout.nodes.get(edge.source);
        const target = layout.nodes.get(edge.target);
        if (!source || !target) return;
        const sourceBox = selectedMilestoneBox(edge.source);
        const targetBox = selectedMilestoneBox(edge.target);
        const line = document.createElementNS(SVG_NS, "line");
        line.setAttribute("x1", String(source.x));
        line.setAttribute("y1", String(source.y + sourceBox.height / 2 - 4));
        line.setAttribute("x2", String(target.x));
        line.setAttribute("y2", String(target.y - targetBox.height / 2 + 4));
        line.classList.add("graph-edge");
        if (stageNodeIds.has(edge.source) && stageNodeIds.has(edge.target)) {
          line.classList.add("selected-stage");
        }
        svg.append(line);
      });
    }

    function drawNodes(svg, layout, scenario, stageNodeIds) {
      layout.nodes.forEach((item, milestoneId) => {
        const group = document.createElementNS(SVG_NS, "g");
        group.classList.add("milestone-node");
        group.dataset.milestoneId = milestoneId;
        group.setAttribute("data-milestone-id", milestoneId);
        group.classList.toggle("selected", state.selectedMilestoneId === milestoneId);
        group.classList.toggle("selected-stage", stageNodeIds.has(milestoneId));
        group.classList.toggle("virtual", Boolean(item.node.virtual));
        const status = milestoneStatus(milestoneId, scenario);
        if (status) group.classList.add(status);
        const box = selectedMilestoneBox(milestoneId);
        group.setAttribute("transform", `translate(${item.x - box.width / 2}, ${item.y - box.height / 2})`);
        group.addEventListener("click", () => focusMilestone(milestoneId));

        const rect = document.createElementNS(SVG_NS, "rect");
        rect.setAttribute("width", String(box.width));
        rect.setAttribute("height", String(box.height));
        rect.setAttribute("rx", "8");
        const name = document.createElementNS(SVG_NS, "text");
        name.setAttribute("x", "12");
        name.setAttribute("y", "21");
        name.textContent = truncate(milestoneId, 18);
        const meta = document.createElementNS(SVG_NS, "text");
        meta.setAttribute("x", "12");
        meta.setAttribute("y", "38");
        meta.setAttribute("font-weight", "400");
        meta.textContent = truncate(milestoneSubtitle(item.node), 18);
        group.append(rect, name, meta);
        if (state.selectedMilestoneId === milestoneId) {
          group.append(milestoneInlineDetail(milestoneId, scenario, box));
        }
        svg.append(group);
      });
    }

    function selectedMilestoneBox(milestoneId) {
      const isSelected = milestoneId && state.selectedMilestoneId === milestoneId;
      return {
        width: isSelected ? 320 : 148,
        height: isSelected ? 218 : 48
      };
    }

    function milestoneInlineDetail(milestoneId, scenario, box) {
      const foreign = document.createElementNS(SVG_NS, "foreignObject");
      foreign.setAttribute("x", "8");
      foreign.setAttribute("y", "54");
      foreign.setAttribute("width", String(box.width - 16));
      foreign.setAttribute("height", String(box.height - 62));

      const detail = el("div", "milestone-inline-detail");
      detail.addEventListener("click", (event) => event.stopPropagation());
      const definition = stageDefinitionForMilestone(milestoneId, scenario);
      const node = graphNodeForMilestone(milestoneId, scenario);
      const matching = milestoneMatchingFor(milestoneId, scenario);
      const bestAttempt = matching ? null : bestMilestoneAttempt(milestoneId, scenario);
      const finalDiagnostic = matching ? null : milestoneFinalDiagnosticFor(milestoneId, scenario);
      const constraints = node && Array.isArray(node.constraints) ? node.constraints : [];

      appendInlineDetailSection(detail, "阶段目标", definition ? definition.stage_goal || "无" : "无");
      appendInlineDetailSection(detail, "milestone 描述", node ? node.description || node.name || "无" : "无");
      appendConstraintDetailSection(detail, constraints);
      appendInlineDetailSection(
        detail,
        "匹配诊断",
        matching ? matchingDetailText(matching) : milestoneFailureDetailText(finalDiagnostic, bestAttempt)
      );

      foreign.append(detail);
      return foreign;
    }

    function appendInlineDetailSection(container, title, text) {
      const section = el("details");
      const heading = el("summary", "detail-summary");
      heading.textContent = title;
      const body = el("pre");
      body.textContent = text;
      section.append(heading, body);
      container.append(section);
    }

    function appendConstraintDetailSection(container, constraints) {
      const section = el("details", "constraint-list");
      const heading = el("summary", "detail-summary");
      heading.textContent = "约束定义";
      section.append(heading);

      if (!constraints.length) {
        const empty = el("pre");
        empty.textContent = "无";
        section.append(empty);
        container.append(section);
        return;
      }

      constraints.forEach((constraint, index) => {
        const item = el("details", "constraint-item");
        const itemHeading = el("summary");
        itemHeading.textContent = constraintItemTitle(constraint, index);
        const body = el("pre");
        body.textContent = constraintDetailText(constraint);
        item.append(itemHeading, body);
        section.append(item);
      });
      container.append(section);
    }

    function constraintItemTitle(constraint, index) {
      if (!constraint) return `constraint ${index + 1}`;
      const id = constraint.constraint_id || `constraint ${index + 1}`;
      const target = constraint.target ? ` · ${constraint.target}` : "";
      return `${id}${target}`;
    }

    function milestoneMatchingFor(milestoneId, scenario) {
      if (!milestoneId || !scenario) return null;
      const metadata = ((scenario.milestone_graph || {}).metadata) || {};
      return (scenario.stage_settlements || []).find((settlement) => {
        if (settlement.milestone_id === milestoneId) return true;
        return settlement.kind === "finish" && milestoneId === (metadata.finish_node_id || "__finish__");
      })?.milestone_matching || null;
    }

    function stageMilestoneIds(stageId, scenario) {
      const selected = new Set();
      if (!stageId || !scenario) return selected;
      const graph = scenario.milestone_graph || {};
      const metadata = graph.metadata || {};
      const settlement = settlementForStage(stageId);
      const report = stageReportForStage(stageId, scenario);
      const definition = stageDefinitionForStage(stageId, scenario);
      let targetId = (settlement && settlement.milestone_id) || (report && report.milestone_id) || (definition && definition.milestone_id) || "";
      if (!targetId && settlement && settlement.kind === "finish") {
        targetId = metadata.finish_node_id || "__finish__";
      }
      if (!targetId) return selected;

      const reportMetadata = (report && report.metadata) || {};
      const anchorId = (
        (settlement && settlement.stage_anchor_milestone_id) ||
        reportMetadata.stage_anchor_milestone_id ||
        (definition && definition.anchor_milestone_id) ||
        stageAnchorForMilestone(targetId, scenario) ||
        (targetId === (metadata.finish_node_id || "__finish__") ? metadata.finish_stage_anchor_predecessor_id : "")
      );
      if (!anchorId) {
        selected.add(targetId);
        return selected;
      }
      return stagePathNodeIds(graph, anchorId, targetId);
    }

    function stagePathNodeIds(graph, anchorId, targetId) {
      const nodeIds = new Set((graph.nodes || []).map((node) => node.milestone_id).filter(Boolean));
      const edges = (graph.edges || []).filter((edge) => edge.source && edge.target);
      edges.forEach((edge) => {
        nodeIds.add(edge.source);
        nodeIds.add(edge.target);
      });
      const selected = new Set();
      if (!nodeIds.has(targetId)) return selected;
      if (!nodeIds.has(anchorId)) {
        selected.add(targetId);
        return selected;
      }

      const outgoing = adjacencyMap(nodeIds);
      const incoming = adjacencyMap(nodeIds);
      edges.forEach((edge) => {
        if (!outgoing.has(edge.source) || !incoming.has(edge.target)) return;
        outgoing.get(edge.source).push(edge.target);
        incoming.get(edge.target).push(edge.source);
      });
      const reachableFromAnchor = reachableNodeIds(anchorId, outgoing);
      const canReachTarget = reachableNodeIds(targetId, incoming);
      nodeIds.forEach((nodeId) => {
        if (reachableFromAnchor.has(nodeId) && canReachTarget.has(nodeId)) selected.add(nodeId);
      });
      if (!selected.size) selected.add(targetId);
      return selected;
    }

    function adjacencyMap(nodeIds) {
      const map = new Map();
      nodeIds.forEach((nodeId) => map.set(nodeId, []));
      return map;
    }

    function reachableNodeIds(startId, adjacency) {
      const visited = new Set([startId]);
      const queue = [startId];
      while (queue.length) {
        const nodeId = queue.shift();
        (adjacency.get(nodeId) || []).forEach((nextId) => {
          if (visited.has(nextId)) return;
          visited.add(nextId);
          queue.push(nextId);
        });
      }
      return visited;
    }

    function stageAnchorForMilestone(milestoneId, scenario) {
      const graphNode = graphNodeForMilestone(milestoneId, scenario);
      return graphNode ? graphNode.stage_anchor_predecessor_id || "" : "";
    }

    function graphNodeForMilestone(milestoneId, scenario) {
      if (!milestoneId || !scenario) return null;
      return ((scenario.milestone_graph || {}).nodes || []).find((node) => node.milestone_id === milestoneId) || null;
    }

    function stageReportForStage(stageId, scenario) {
      if (!stageId || !scenario) return null;
      return (scenario.stage_reports || []).find((report) => report.stage_id === stageId) || null;
    }

    function stageDefinitionForStage(stageId, scenario) {
      if (!stageId || !scenario) return null;
      return (scenario.stage_definitions || []).find((definition) => definition.stage_id === stageId) || null;
    }

    function stageDefinitionForMilestone(milestoneId, scenario) {
      if (!milestoneId || !scenario) return null;
      return (scenario.stage_definitions || []).find((definition) => definition.milestone_id === milestoneId) || null;
    }

    function milestoneSubtitle(node) {
      if (!node) return "";
      if (node.virtual) return node.name || "";
      if (node.stage_anchor_predecessor_id) return `anchor ${node.stage_anchor_predecessor_id}`;
      return node.required ? "required" : "optional";
    }

    function focusStepCard(stepIndex) {
      if (stepIndex === null || stepIndex === undefined) return;
      const panel = document.querySelector(".trajectory-panel .panel-body");
      const target = panel ? panel.querySelector(`[data-step-index="${stepIndex}"]`) : null;
      if (!panel || !target) return;
      const panelRect = panel.getBoundingClientRect();
      const targetRect = target.getBoundingClientRect();
      const targetTop = targetRect.top - panelRect.top + panel.scrollTop;
      const centeredTop = targetTop - (panel.clientHeight - target.clientHeight) / 2;
      panel.scrollTo({ top: Math.max(0, centeredTop), behavior: "smooth" });
    }

    function scrollToMilestoneNode(milestoneId) {
      if (!milestoneId) return;
      const panel = document.querySelector(".graph-panel .panel-body");
      const nodes = panel ? Array.from(panel.querySelectorAll(".milestone-node")) : [];
      const target = nodes.find((node) => node.dataset.milestoneId === milestoneId);
      if (!panel || !target) return;
      const panelRect = panel.getBoundingClientRect();
      const targetRect = target.getBoundingClientRect();
      const targetTop = targetRect.top - panelRect.top + panel.scrollTop;
      const targetLeft = targetRect.left - panelRect.left + panel.scrollLeft;
      const centeredTop = targetTop - (panel.clientHeight - targetRect.height) / 2;
      const centeredLeft = targetLeft - (panel.clientWidth - targetRect.width) / 2;
      panel.scrollTo({
        top: Math.max(0, centeredTop),
        left: Math.max(0, centeredLeft),
        behavior: "smooth"
      });
    }

    function scrollToStageCard(stageId) {
      if (!stageId) return;
      const panel = document.querySelector(".stage-panel .panel-body");
      const target = panel ? panel.querySelector(`[data-stage-id="${stageId}"]`) : null;
      if (!panel || !target) return;
      const panelRect = panel.getBoundingClientRect();
      const targetRect = target.getBoundingClientRect();
      const targetTop = targetRect.top - panelRect.top + panel.scrollTop;
      const centeredTop = targetTop - (panel.clientHeight - targetRect.height) / 2;
      panel.scrollTo({ top: Math.max(0, centeredTop), behavior: "smooth" });
    }

    function scrollToMatchedStep(milestoneId) {
      const scenario = currentScenario();
      if (!scenario) return;
      const attempts = scenario.match_attempts || [];
      const match = attempts.find((item) => item.selected_milestone_id === milestoneId);
      if (match) {
        focusStepCard(match.step_index);
        return;
      }
      const settlement = (scenario.stage_settlements || []).find((item) => item.milestone_id === milestoneId);
      if (settlement) {
        focusStepCard(settlement.start_step_index);
        return;
      }
      const best = bestMilestoneAttempt(milestoneId, scenario);
      if (best) focusStepCard(best.attempt.step_index);
    }

    function scrollToStepRange(settlement) {
      if (!settlement) return;
      focusStepCard(settlement.start_step_index);
    }

    function settlementForStage(stageId) {
      if (!stageId) return null;
      const scenario = currentScenario();
      if (!scenario) return null;
      return (scenario.stage_settlements || []).find((settlement) => (
        settlement.stage_id === stageId ||
        settlement.settlement_id === stageId
      )) || null;
    }

    function milestonesForStep(step, scenario) {
      const stepIndex = Number(step.index);
      const stepId = step.step_id;
      return (scenario.match_attempts || [])
        .filter((item) => item.step_index === stepIndex || item.step_id === stepId)
        .map((item) => item.selected_milestone_id)
        .filter(Boolean);
    }

    function milestoneStatus(milestoneId, scenario) {
      const report = (scenario.stage_reports || []).find((item) => item.milestone_id === milestoneId);
      if (!report || !report.status) return "";
      if (report.status === "pass") return "pass";
      if (report.status === "fail" || report.status === "fatal") return "fail";
      return "";
    }

    function statusBadge(status) {
      const badge = el("span", "badge");
      const value = status || "unknown";
      badge.textContent = value;
      if (value === "pass") badge.classList.add("ok");
      else if (value === "fail" || value === "fatal") badge.classList.add("bad");
      else badge.classList.add("warn");
      return badge;
    }

    function stageScoreSection(title, rows) {
      if (!rows || !rows.length) return null;
      const section = el("details", "stage-section score-section");
      const heading = el("summary", "detail-summary");
      heading.textContent = title;
      section.append(heading, ...rows);
      return section;
    }

    function dimensionRows(report) {
      return scoreRows(report.dimension_scores || {}, "");
    }

    function weightRows(report) {
      return scoreRows(report.next_weights || {}, "weight-fill");
    }

    function policySection(report) {
      const metadata = report.metadata || {};
      const active = metadata.active_evaluation_policy;
      const next = metadata.next_evaluation_policy;
      const update = metadata.evaluation_policy_update;
      if (!active && !next && !update) return null;
      return detailBlock("评估策略", JSON.stringify({
        active_evaluation_policy: active || null,
        next_evaluation_policy: next || null,
        evaluation_policy_update: update || null
      }, null, 2));
    }

    function pendingMetadataSection(report) {
      const metadata = report.metadata || {};
      const keys = ["blocker", "last_reject_reason", "attempt_count", "best_score", "best_boundary_step_index", "failure_kind"];
      const payload = {};
      keys.forEach((key) => {
        if (metadata[key] !== null && metadata[key] !== undefined && metadata[key] !== "") {
          payload[key] = metadata[key];
        }
      });
      return Object.keys(payload).length ? detailBlock("pending 诊断", JSON.stringify(payload, null, 2)) : null;
    }

    function failureSummarySection(report) {
      if (!report || !["fail", "missing", "invalid"].includes(report.status)) return null;
      const text = milestoneFailureDetailText(
        report.metadata || null,
        bestMilestoneAttempt(report.milestone_id, currentScenario()),
        false
      );
      return text ? detailBlock("匹配失败摘要", text, true) : null;
    }

    function milestoneFinalDiagnosticFor(milestoneId, scenario) {
      if (!milestoneId || !scenario) return null;
      const report = (scenario.stage_reports || []).find((item) => item.milestone_id === milestoneId);
      const metadata = report && report.metadata;
      return metadata && (metadata.failure_summary || metadata.failed_constraints) ? metadata : null;
    }

    function milestoneFailureDetailText(metadata, bestAttempt, includeBestAttemptDetail) {
      const parts = [];
      if (metadata && metadata.failure_summary) {
        parts.push(String(metadata.failure_summary));
      } else if (bestAttempt) {
        parts.push(attemptFailureSummary(bestAttempt));
      }
      const reasons = metadata && Array.isArray(metadata.failure_reasons) ? metadata.failure_reasons : [];
      if (reasons.length > 1) {
        parts.push("", "failure_reasons:");
        reasons.slice(1, 5).forEach((reason) => parts.push(`- ${String(reason)}`));
      }
      const failedConstraints = metadata && Array.isArray(metadata.failed_constraints) ? metadata.failed_constraints : [];
      if (failedConstraints.length) {
        parts.push("", "failed_constraints:");
        failedConstraints.forEach((item) => parts.push(failedConstraintLine(item)));
      }
      if (bestAttempt && includeBestAttemptDetail !== false) {
        parts.push("", "best_attempt:", milestoneAttemptDetailText(bestAttempt));
      }
      return parts.join("\n").trim() || "无";
    }

    function attemptFailureSummary(bestAttempt) {
      const attempt = bestAttempt.attempt || {};
      const candidate = bestAttempt.candidate || {};
      const score = candidate.score || {};
      const boundary = candidate.boundary || score.boundary || {};
      const failed = Array.isArray(score.constraint_scores)
        ? score.constraint_scores
            .filter((item) => item && (item.missing || Number(item.score) < 1))
            .sort((left, right) => Number(left.score || 0) - Number(right.score || 0))
        : [];
      let summary = (
        `milestone ${candidate.milestone_id || "unknown"} 未匹配；最佳候选位于 step=${formatValue(boundary.step_index || attempt.step_index)}，` +
        `得分 ${formatScore(score.score)}（status=${formatValue(score.status)}，reject_reason=${formatValue(candidate.reject_reason)}）。`
      );
      if (failed.length) {
        const lead = failed[0];
        const evidence = Array.isArray(lead.evidence) && lead.evidence.length ? `；证据：${lead.evidence[0]}` : "";
        summary += ` 主要低分约束：${lead.constraint_id || "constraint"} score=${formatScore(lead.score)}${evidence}。`;
      }
      return summary;
    }

    function failedConstraintLine(item) {
      if (!item) return "- constraint: 无";
      const pieces = [
        item.constraint_id || "constraint",
        `score=${formatScore(item.score)}`,
        `threshold=${formatScore(item.threshold)}`
      ];
      if (item.goal_hint) pieces.push(String(item.goal_hint));
      if (item.evidence && item.evidence.length) pieces.push(`evidence=${item.evidence.join(" | ")}`);
      if (item.actual_excerpt) pieces.push(`actual=${item.actual_excerpt}`);
      return `- ${pieces.join("; ")}`;
    }

    function pendingAttemptSection(report) {
      if (!report || !["fail", "missing"].includes(report.status)) return null;
      const scenario = currentScenario();
      const best = bestMilestoneAttempt(report.milestone_id, scenario);
      return best ? detailBlock("最佳匹配尝试", milestoneAttemptDetailText(best), true) : null;
    }

    function arrayDetailBlock(title, values) {
      if (!Array.isArray(values) || !values.length) return null;
      return detailBlock(title, values.map((item) => `- ${String(item)}`).join("\n"));
    }

    function constraintDefinitionLines(milestoneId, scenario) {
      const node = graphNodeForMilestone(milestoneId, scenario);
      if (!node || !Array.isArray(node.constraints)) return [];
      return node.constraints.slice(0, 2).map((constraint) => {
        const id = constraint.constraint_id || "constraint";
        const operator = constraint.operator || "";
        const hard = constraint.hard ? "hard" : "soft";
        return `${id} ${operator} ${hard}`.trim();
      });
    }

    function scoreRows(values, fillClassName) {
      return Object.entries(values)
        .filter(([, value]) => Number.isFinite(Number(value)))
        .sort(([left], [right]) => left.localeCompare(right))
        .map(([key, value]) => scoreRow(dimensionLabel(key), Number(value), fillClassName));
    }

    function scoreRow(label, value, fillClassName) {
      const row = el("div", "score-row");
      const name = el("span", "score-label");
      name.textContent = label;
      const valueBox = el("span", "score-value");
      const number = el("span");
      number.textContent = formatScore(value);
      const bar = el("span", "score-bar");
      const fill = el("span", `score-fill ${fillClassName || ""}`);
      fill.style.width = `${Math.max(0, Math.min(100, value * 100))}%`;
      bar.append(fill);
      valueBox.append(number, bar);
      row.append(name, valueBox);
      return row;
    }

    function dimensionLabel(key) {
      const labels = {
        progress: "进展",
        state_consistency: "状态一致",
        tool_quality: "工具质量",
        efficiency: "效率",
        safety: "安全",
        interaction_quality: "交互质量",
        recovery: "恢复"
      };
      return labels[key] || key;
    }

    function appendPanelTitle(container, title, subtitle, extra) {
      const head = el("div", "panel-title");
      const text = el("div");
      const h2 = el("h2");
      h2.textContent = title;
      const p = el("p");
      p.textContent = subtitle || "";
      text.append(h2, p);
      head.append(text);
      if (extra) head.append(extra);
      container.append(head);
    }

    function appendEmpty(container, message) {
      const node = el("div", "empty");
      node.textContent = message;
      container.append(node);
    }

    function appendEmptyInline(container, message) {
      const node = el("span", "metric-chip");
      node.textContent = message;
      container.append(node);
    }

    function detailBlock(title, text, open) {
      const block = el("details");
      const summary = el("summary", "detail-summary");
      summary.textContent = title;
      const body = el("pre", "detail-text");
      body.textContent = text || "无";
      block.open = Boolean(open);
      block.append(summary, body);
      return block;
    }

    function metric(label, value) {
      const chip = el("span", "metric-chip");
      const name = document.createTextNode(label);
      const strong = el("strong");
      strong.textContent = value === null || value === undefined || value === "" ? "无" : String(value);
      chip.append(name, strong);
      return chip;
    }

    function toolCallText(toolCall) {
      const args = JSON.stringify(toolCall.arguments || {}, null, 2);
      return `${toolCall.name || "unknown"}\n${args}`;
    }

    function toolResultText(toolResult) {
      const lines = [`success: ${formatValue(toolResult.success)}`];
      if (toolResult.content) lines.push(`content: ${toolResult.content}`);
      if (toolResult.exception) lines.push(`exception: ${toolResult.exception}`);
      return lines.join("\n");
    }

    function stepRangeText(settlement) {
      const start = formatValue(settlement.start_step_index);
      const end = formatValue(settlement.end_step_index);
      return `${start} - ${end}`;
    }

    function formatScore(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return "无";
      return number.toFixed(3).replace(/0+$/, "").replace(/\.$/, "");
    }

    function formatSeconds(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return "无";
      return `${number.toFixed(1)}s`;
    }

    function formatValue(value) {
      if (value === null || value === undefined || value === "") return "无";
      return String(value);
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function truncate(value, limit) {
      const text = String(value || "");
      return text.length > limit ? `${text.slice(0, limit)}...` : text;
    }

    function shortJson(value, limit) {
      const text = typeof value === "string" ? value : JSON.stringify(value, null, 2);
      return truncate(text, limit || 600).replace(/\n/g, " ");
    }

    function resetSelection() {
      state.selectedMilestoneId = null;
      state.selectedStageId = null;
      state.openStageIds.clear();
    }

    function setStageOpen(stageId, open) {
      if (!stageId) return;
      if (open) state.openStageIds.add(stageId);
      else state.openStageIds.delete(stageId);
    }

    function clear(node) {
      while (node.firstChild) node.removeChild(node.firstChild);
    }

    function el(tag, className) {
      const node = document.createElement(tag);
      if (className) {
        className.split(" ").filter(Boolean).forEach((name) => node.classList.add(name));
      }
      return node;
    }
  </script>
</body>
</html>
