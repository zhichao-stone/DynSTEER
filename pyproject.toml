[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynsteer"
version = "0.1.0"
description = "Dynamic stage-wise trajectory evaluation and execution-time review for agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai==1.17.0",
    "httpx==0.27.2",
    "anthropic==0.26.1",
    "docker>=7",
    "polars==0.20.31",
    "networkx>=3.2",
    "pyyaml>=6",
    "tqdm>=4.66.0",
    "scipy==1.13.1",
]

[dependency-groups]
toolsandbox = [
    "ccy==1.3.1",
    "decorator==5.1.1",
    "dill==0.3.8",
    "geopy==2.4.1",
    "holidays==0.51",
    "huggingface-hub==0.23.4",
    "jsonschema==4.19.2",
    "langchain==0.1.3",
    "numpy==1.26.4",
    "phonenumbers==8.13.39",
    "pint==0.23",
    "pyyaml==6.0.1",
    "rapidfuzz==3.9.3",
    "requests==2.32.3",
    "rouge-score==0.1.2",
    "sentencepiece==0.2.0",
    "strenum==0.4.15",
    "tenacity==8.4.1",
    "transformers==4.41.2",
    "tree-sitter==0.22.3",
    "tree-sitter-languages==1.10.2",
    "vertexai==1.49.0",
]
swebench_pro = [
    "pandas>=2.2",
]
[tool.setuptools.packages.find]
include = ["dynsteer*"]
