[project]
name = "dynamictrackeval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai==1.17.0",
    "httpx==0.27.2",
    "anthropic==0.112.0",
    "polars==0.20.31",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
agentcompass = [
    "agentcompass",
    "rich>=13.0.0",
    "tabulate>=0.9.0",
]

[tool.uv.sources]
agentcompass = { path = "../AgentCompass", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
